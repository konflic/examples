<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nonograms — Picross Puzzle</title>
    <link rel="stylesheet" href="ui.css">
    <style>
        html, body { height: 100%; overflow: hidden; }
        body {
            text-align: center;
            display: flex;
            flex-direction: column;
            height: 100dvh;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        h1 { margin: 8px 0 4px; font-size: 1.4rem; flex-shrink: 0; }
        .controls {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: min(94vw, 900px);
            margin: 4px auto 8px;
            padding: 8px 12px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            flex-shrink: 0;
        }
        .controls .field {
            display: flex;
            align-items: center;
            gap: 8px;
            justify-content: center;
            min-width: 0;
        }
        .controls .field label {
            font-size: 13px;
            color: var(--muted);
            white-space: nowrap;
        }
        .controls .field select {
            flex: 1;
            min-width: 0;
            width: 100%;
        }
        .controls .btns {
            display: flex;
            gap: 8px;
        }
        .controls .btns button {
            flex: 1;
            min-width: 0;
            border: none;
            border-radius: 8px;
            padding: 8px 14px;
        }
        .tools {
            display: flex;
            gap: 8px;
            width: min(94vw, 900px);
            margin: 2px auto 6px;
            padding: 8px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            flex-shrink: 0;
        }
        .tools .tool {
            flex: 1;
            min-width: 0;
            justify-content: center;
            border: none;
            border-radius: 8px;
        }
        .stats {
            gap: 6px;
            width: min(94vw, 900px);
            margin: 4px auto 8px;
        }
        .stat { padding: 3px 9px; font-size: 12px; }
        .game-area {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: auto;
            padding: 4px;
        }
        .board-wrap {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px;
            display: inline-block;
            margin: auto;
        }
        .board { display: grid; }
        .corner { background: #1a1a1a; border: 1px solid #2a2a2a; }
        .col-clue {
            background: #222;
            border: 1px solid #2a2a2a;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            align-content: center;
            font-weight: 600;
            color: var(--accent2);
            overflow: hidden;
        }
        .row-clue {
            background: #222;
            border: 1px solid #2a2a2a;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: flex-end;
            align-content: center;
            font-weight: 600;
            color: var(--accent2);
            overflow: hidden;
            padding-right: 2px;
        }
        .clue-num {
            margin: 1px;
            line-height: 1;
            display: inline-block;
        }
        .cell {
            border: 1px solid #2a2a2a;
            background: #262626;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            transition: background 0.1s;
        }
        .cell:hover { background: #333; }
        .cell.filled { background: var(--accent); border-color: #7c6bcf; }
        .cell.wrong { background: var(--danger); border-color: #c45252; }
        .cell.marked { color: #777; font-weight: bold; }
        .cell.hint { background: var(--accent2); border-color: #28a87a; }
        .note { color: #666; font-size: 11px; flex-shrink: 0; }
        @media (max-width: 600px) {
            h1 { font-size: 1.1rem; margin: 6px 0 2px; }
            .stats { gap: 4px; margin: 2px auto 4px; }
            .stat { padding: 2px 6px; font-size: 11px; }
            .controls { gap: 6px; margin: 2px auto 6px; padding: 6px 10px; }
            .controls .btns button { padding: 5px 9px; }
            select, button { font-size: 12px; padding: 5px 9px; }
            .tools { gap: 6px; margin: 2px auto 4px; padding: 6px; }
            .tools .tool { padding: 5px 9px; }
        }
        @media (max-height: 640px) {
            h1 { font-size: 1rem; margin: 4px 0 2px; }
            .board-wrap { padding: 4px; }
        }
    </style>
</head>
<body>
    <button class="theme-toggle" id="theme-toggle" title="Toggle theme">☀</button>
    <h1>Nonograms — Picross</h1>
    <div class="controls">
        <div class="field">
            <label for="level-select">Level:</label>
            <select id="level-select"></select>
        </div>
        <div class="btns">
            <button id="new-btn">New Game</button>
            <button id="hint-btn">Hint</button>
        </div>
    </div>
    <div class="stats">
        <div class="stat"><span class="stat-label">Time</span><span class="stat-value">⏱ <span id="time">0:00</span></span></div>
        <div class="stat"><span class="stat-label">Mistakes</span><span class="stat-value" id="mistakes">0</span></div>
        <div class="stat"><span class="stat-label">Solved</span><span class="stat-value" id="solved">0</span></div>
        <div class="stat"><span class="stat-label">Best</span><span class="stat-value" id="best">–</span></div>
    </div>
    <div class="tools">
        <button id="mode-fill" class="tool active"><span class="swatch" style="background:var(--accent)"></span>Fill</button>
        <button id="mode-x" class="tool"><span class="swatch" style="color:#999;display:flex;align-items:center;justify-content:center;background:#2a2a2a">✕</span>Mark</button>
        <button id="mode-erase" class="tool"><span class="swatch" style="background:#2a2a2a"></span>Erase</button>
    </div>
    <div class="game-area">
        <div class="board-wrap">
            <div id="board" class="board"></div>
        </div>
    </div>
    <div id="legend" class="note">Numbers show how many consecutive filled cells are in that row/column.</div>
    <script>
    'use strict';
    document.addEventListener('DOMContentLoaded', () => {
        const LEVELS = [
            { r: 5,  c: 5,  d: 0.55, name: '5×5 · Beginner' },
            { r: 6,  c: 6,  d: 0.50, name: '6×6 · Easy' },
            { r: 7,  c: 7,  d: 0.45, name: '7×7 · Medium' },
            { r: 8,  c: 8,  d: 0.38, name: '8×8 · Hard' },
            { r: 9,  c: 9,  d: 0.32, name: '9×9 · Expert' },
            { r: 10, c: 10, d: 0.26, name: '10×10 · Nightmare' },
        ];

        const levelSelect = document.getElementById('level-select');
        const newBtn = document.getElementById('new-btn');
        const hintBtn = document.getElementById('hint-btn');
        const boardEl = document.getElementById('board');
        const timeEl = document.getElementById('time');
        const mistakesEl = document.getElementById('mistakes');
        const solvedEl = document.getElementById('solved');
        const bestEl = document.getElementById('best');
        const modeBtns = { fill: document.getElementById('mode-fill'), x: document.getElementById('mode-x'), erase: document.getElementById('mode-erase') };

        // Audio
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        function beep(freq = 700, dur = 0.1, vol = 0.25) {
            const o = audioContext.createOscillator();
            const g = audioContext.createGain();
            o.connect(g); g.connect(audioContext.destination);
            o.type = 'sine'; o.frequency.value = freq;
            g.gain.setValueAtTime(vol, audioContext.currentTime);
            g.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + dur);
            o.start(); o.stop(audioContext.currentTime + dur);
        }
        function successSound() { beep(600, 0.07, 0.25); setTimeout(() => beep(900, 0.07, 0.2), 80); }
        function errorSound() { beep(180, 0.14, 0.18); }
        function winSound() { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, 0.12, 0.25), i * 120)); }

        // State
        let cfg = null, pattern = [], rowClues = [], colClues = [], state = [];
        let mistakes = 0, gameOver = false, startTime = 0, elapsed = 0, timerId = null, mode = 'fill';
        let cellEls = [], hintUsed = 0;

        function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
        function load(k, d) { const v = localStorage.getItem(k); return v === null ? d : Number(v); }
        function save(k, v) { localStorage.setItem(k, String(v)); }

        // ---------- Puzzle generation ----------
        function lineClues(line) {
            const res = [];
            let run = 0;
            for (const v of line) {
                if (v) run++;
                else { if (run) { res.push(run); run = 0; } }
            }
            if (run) res.push(run);
            return res.length ? res : [0];
        }

        function linePlacements(len, clue, known) {
            const results = [];
            const b = clue.length;
            const starts = new Array(b).fill(0);
            function rec(i, minStart) {
                if (i === b) {
                    const covered = new Array(len).fill(false);
                    for (let k = 0; k < b; k++)
                        for (let c = starts[k]; c < starts[k] + clue[k]; c++) covered[c] = true;
                    for (let k = 0; k < b; k++) {
                        const s = starts[k], e = s + clue[k];
                        for (let c = s; c < e; c++) if (known[c] === -1) return;
                        if (k < b - 1 && known[e] === 1) return;
                    }
                    for (let c = 0; c < len; c++) if (!covered[c] && known[c] === 1) return;
                    results.push(starts.slice());
                    return;
                }
                let minNext = 0;
                for (let k = i + 1; k < b; k++) minNext += clue[k];
                if (i + 1 < b) minNext += (b - 1 - i);
                const maxStart = len - clue[i] - minNext;
                for (let s = minStart; s <= maxStart; s++) {
                    starts[i] = s;
                    rec(i + 1, s + clue[i] + 1);
                }
            }
            rec(0, 0);
            return results;
        }

        function solveLine(len, clue, known) {
            const positions = linePlacements(len, clue, known);
            if (positions.length === 0) return null;
            const total = positions.length;
            const nFilled = new Array(len).fill(0), nEmpty = new Array(len).fill(0);
            for (const p of positions) {
                const covered = new Array(len).fill(false);
                for (let k = 0; k < p.length; k++)
                    for (let c = p[k]; c < p[k] + clue[k]; c++) covered[c] = true;
                for (let c = 0; c < len; c++) covered[c] ? nFilled[c]++ : nEmpty[c]++;
            }
            const known2 = known.slice();
            let changed = false;
            for (let c = 0; c < len; c++) {
                if (known[c] !== 0) continue;
                if (nFilled[c] === total) { known2[c] = 1; changed = true; }
                else if (nEmpty[c] === total) { known2[c] = -1; changed = true; }
            }
            return { known: known2, changed };
        }

        function solveGrid(rows, cols, rClues, cClues) {
            const known = Array.from({ length: rows }, () => new Array(cols).fill(0));
            let depth = 0;
            while (true) {
                let changed = false;
                for (let r = 0; r < rows; r++) {
                    const res = solveLine(cols, rClues[r], known[r]);
                    if (!res) return null;
                    for (let c = 0; c < cols; c++)
                        if (res.known[c] !== known[r][c]) { known[r][c] = res.known[c]; changed = true; }
                }
                for (let c = 0; c < cols; c++) {
                    const line = known.map(row => row[c]);
                    const res = solveLine(rows, cClues[c], line);
                    if (!res) return null;
                    for (let r = 0; r < rows; r++)
                        if (res.known[r] !== known[r][c]) { known[r][c] = res.known[r]; changed = true; }
                }
                if (!changed) break;
                depth++;
                if (depth > 5000) return null;
            }
            const solved = known.every(row => row.every(v => v !== 0));
            return solved ? { grid: known, depth } : null;
        }

        function randomMatrix(rows, cols, d) {
            const m = Array.from({ length: rows }, () => Array.from({ length: cols }, () => Math.random() < d));
            for (let r = 0; r < rows; r++) {
                const full = m[r].every(v => v), empty = m[r].every(v => !v);
                if (full || empty) return null;
            }
            for (let c = 0; c < cols; c++) {
                let full = true, empty = true;
                for (let r = 0; r < rows; r++) { if (!m[r][c]) full = false; if (m[r][c]) empty = false; }
                if (full || empty) return null;
            }
            return m;
        }

        function fallbackPattern(rows, cols) {
            // Randomized full bar across a random block of columns —
            // always logically solvable and unique, never a fixed puzzle.
            const m = Array.from({ length: rows }, () => new Array(cols).fill(false));
            const bw = cols > 3 ? randInt(1, cols - 1) : cols;
            const start = cols > 3 ? randInt(0, cols - bw) : 0;
            for (let r = 0; r < rows; r++)
                for (let c = start; c < start + bw; c++) m[r][c] = true;
            return m;
        }

        function generatePuzzle(rows, cols, density) {
            const t0 = performance.now();
            let d = density;
            for (let t = 0; t < 300; t++) {
                if (performance.now() - t0 > 3500) break;
                const m = randomMatrix(rows, cols, d);
                if (!m) { d = Math.min(0.6, d + 0.02); continue; }
                const rClues = m.map(lineClues), cClues = [];
                for (let c = 0; c < cols; c++) cClues.push(lineClues(m.map(row => row[c])));
                const res = solveGrid(rows, cols, rClues, cClues);
                if (res) {
                    return { rows, cols, density: d, pattern: m, rowClues: rClues, colClues: cClues, depth: res.depth };
                }
                if (t > 40 && d < 0.55) d += 0.02; // denser grids are more solvable
            }
            const m = fallbackPattern(rows, cols);
            return { rows, cols, pattern: m, rowClues: m.map(lineClues),
                     colClues: m[0].map((_, c) => lineClues(m.map(row => row[c]))), depth: 1 };
        }

        // ---------- Level UI ----------
        function buildLevelOptions() {
            LEVELS.forEach((l, i) => {
                const opt = document.createElement('option');
                opt.value = i;
                opt.textContent = l.name;
                levelSelect.appendChild(opt);
            });
        }

        // ---------- Board rendering ----------
        function renderBoard() {
            const rows = cfg.r, cols = cfg.c;
            boardEl.innerHTML = '';
            boardEl.style.gridTemplateColumns = '';
            boardEl.style.gridTemplateRows = '';

            const availW = window.innerWidth - 40;
            const availH = Math.max(200, window.innerHeight - 250);
            const cell = Math.max(18, Math.min(44, Math.floor(Math.min(availW / (cols + 1.5), availH / (rows + 1.5)))));
            const maxRowClueLen = Math.max(...rowClues.map(c => c.length));
            const maxColClueLen = Math.max(...colClues.map(c => c.length));
            const rowClueW = Math.min(72, Math.max(34, maxRowClueLen * 9 + 8));
            const colClueH = Math.min(72, Math.max(34, maxColClueLen * 9 + 8));
            const clueFont = Math.min(11, Math.max(8, Math.floor(cell * 0.32)));
            const clueFontTop = Math.min(11, Math.max(7, Math.floor(colClueH / Math.max(1, maxColClueLen))));

            boardEl.style.gridTemplateColumns = rowClueW + 'px ' + ('repeat(' + cols + ',' + cell + 'px)');
            boardEl.style.gridTemplateRows = colClueH + 'px ' + ('repeat(' + rows + ',' + cell + 'px)');

            const corner = document.createElement('div');
            corner.className = 'corner';
            corner.style.gridColumn = '1';
            corner.style.gridRow = '1';
            boardEl.appendChild(corner);

            for (let c = 0; c < cols; c++) {
                const d = document.createElement('div');
                d.className = 'col-clue';
                d.style.gridColumn = (c + 2);
                d.style.gridRow = '1';
                d.style.fontSize = clueFontTop + 'px';
                for (const n of colClues[c]) {
                    const s = document.createElement('span');
                    s.className = 'clue-num';
                    s.textContent = n;
                    d.appendChild(s);
                }
                boardEl.appendChild(d);
            }
            for (let r = 0; r < rows; r++) {
                const d = document.createElement('div');
                d.className = 'row-clue';
                d.style.gridColumn = '1';
                d.style.gridRow = (r + 2);
                d.style.fontSize = clueFont + 'px';
                for (const n of rowClues[r]) {
                    const s = document.createElement('span');
                    s.className = 'clue-num';
                    s.textContent = n;
                    d.appendChild(s);
                }
                boardEl.appendChild(d);
            }

            cellEls = [];
            for (let r = 0; r < rows; r++) {
                cellEls[r] = [];
                for (let c = 0; c < cols; c++) {
                    const d = document.createElement('div');
                    d.className = 'cell';
                    d.style.gridColumn = (c + 2);
                    d.style.gridRow = (r + 2);
                    d.dataset.r = r;
                    d.dataset.c = c;
                    d.addEventListener('click', () => onCell(r, c));
                    boardEl.appendChild(d);
                    cellEls[r][c] = d;
                }
            }
            updateCells();
        }

        function updateCells() {
            for (let r = 0; r < cfg.r; r++) {
                for (let c = 0; c < cfg.c; c++) {
                    const el = cellEls[r][c];
                    const s = state[r][c];
                    el.className = 'cell';
                    if (s === 1) el.classList.add('filled');
                    else if (s === -1) el.classList.add('marked');
                    else if (s === 2) el.classList.add('wrong');
                    else if (s === 3) el.classList.add('hint');
                    el.textContent = (s === -1) ? '✕' : '';
                }
            }
        }

        // ---------- Game logic ----------
        function setMode(m) {
            mode = m;
            for (const k in modeBtns) modeBtns[k].classList.toggle('active', k === m);
        }

        function onCell(r, c) {
            if (gameOver || !cfg) return;
            if (audioContext.state === 'suspended') audioContext.resume();
            const isPatternFilled = pattern[r][c];
            if (mode === 'fill') {
                if (state[r][c] === 1 || state[r][c] === 3) {
                    state[r][c] = 0;
                } else if (isPatternFilled) {
                    state[r][c] = 1;
                    successSound();
                } else {
                    state[r][c] = 2;
                    mistakes++;
                    mistakesEl.textContent = mistakes;
                    errorSound();
                }
            } else if (mode === 'x') {
                state[r][c] = (state[r][c] === -1) ? 0 : -1;
            } else {
                state[r][c] = 0;
            }
            updateCells();
            checkWin();
        }

        function checkWin() {
            if (gameOver) return;
            for (let r = 0; r < cfg.r; r++)
                for (let c = 0; c < cfg.c; c++) {
                    const s = state[r][c];
                    if (pattern[r][c]) { if (s !== 1 && s !== 3) return; }
                    else { if (s === 1) return; }
                }
            gameOver = true;
            clearInterval(timerId);
            elapsed = Math.round((performance.now() - startTime) / 1000);
            solvedEl.textContent = load('nono_solved', 0) + 1;
            save('nono_solved', load('nono_solved', 0));
            const lIdx = Number(levelSelect.value);
            const bestKey = 'nono_best_' + lIdx;
            const prev = localStorage.getItem(bestKey);
            if (prev === null || elapsed < Number(prev)) {
                save(bestKey, elapsed);
                bestEl.textContent = fmtTime(elapsed);
            }
            winSound();
        }

        function fmtTime(s) {
            s = Math.max(0, Math.floor(s));
            const m = Math.floor(s / 60), r = s % 60;
            return m + ':' + String(r).padStart(2, '0');
        }

        function updateTimer() {
            if (cfg.time > 0 && !gameOver) {
                const left = cfg.time - Math.floor((performance.now() - startTime) / 1000);
                if (left <= 0) {
                    gameOver = true;
                    clearInterval(timerId);
                    errorSound();
                    return;
                }
                timeEl.textContent = fmtTime(left);
            } else {
                elapsed = Math.floor((performance.now() - startTime) / 1000);
                timeEl.textContent = fmtTime(elapsed);
            }
        }

        function newGame() {
            if (audioContext.state === 'suspended') audioContext.resume();
            const lIdx = Number(levelSelect.value);
            cfg = LEVELS[lIdx];
            boardEl.innerHTML = '';
            setTimeout(() => {
                const puz = generatePuzzle(cfg.r, cfg.c, cfg.d);
                pattern = puz.pattern;
                rowClues = puz.rowClues;
                colClues = puz.colClues;
                state = pattern.map(row => row.map(() => 0));
                mistakes = 0;
                gameOver = false;
                hintUsed = 0;
                mistakesEl.textContent = 0;
                const bestKey = 'nono_best_' + lIdx;
                bestEl.textContent = localStorage.getItem(bestKey) !== null ? fmtTime(Number(localStorage.getItem(bestKey))) : '–';
                startTime = performance.now();
                clearInterval(timerId);
                timerId = setInterval(updateTimer, 1000);
                renderBoard();
                updateTimer();
            }, 30);
        }

        hintBtn.addEventListener('click', () => {
            if (gameOver || !cfg) return;
            if (hintUsed >= 3) {
                errorSound();
                return;
            }
            const candidates = [];
            for (let r = 0; r < cfg.r; r++)
                for (let c = 0; c < cfg.c; c++)
                    if (pattern[r][c] && state[r][c] !== 1 && state[r][c] !== 3) candidates.push([r, c]);
            if (!candidates.length) return;
            const [r, c] = candidates[randInt(0, candidates.length - 1)];
            state[r][c] = 3;
            hintUsed++;
            successSound();
            updateCells();
            checkWin();
        });

        newBtn.addEventListener('click', newGame);
        modeBtns.fill.addEventListener('click', () => setMode('fill'));
        modeBtns.x.addEventListener('click', () => setMode('x'));
        modeBtns.erase.addEventListener('click', () => setMode('erase'));
        function updateBest() {
            const bestKey = 'nono_best_' + levelSelect.value;
            bestEl.textContent = localStorage.getItem(bestKey) !== null ? fmtTime(Number(localStorage.getItem(bestKey))) : '–';
        }
        levelSelect.addEventListener('change', () => { updateBest(); newGame(); });

        buildLevelOptions();
        newGame();
    });
    </script>
    <script>
    (function(){
        var t=localStorage.getItem("ui-theme")||"dark";
        document.documentElement.dataset.theme=t;
        var btn=document.getElementById("theme-toggle");
        btn.textContent=t==="dark"?"☀":"☾";
        btn.addEventListener("click",function(){
            t=document.documentElement.dataset.theme==="dark"?"light":"dark";
            document.documentElement.dataset.theme=t;
            localStorage.setItem("ui-theme",t);
            btn.textContent=t==="dark"?"☀":"☾";
        });
    })();
    </script>
</body>
</html>
