<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Hub</title>
    <link rel="stylesheet" href="ui.css">
    <style>
        :root {
            --primary: #6c5ce7;
            --secondary: #a29bfe;
            --dark: #1a1a2e;
            --darker: #16213e;
            --light: #e2e2e2;
        }

        * { margin: 0; padding: 0; }

        body {
            background: linear-gradient(135deg, var(--dark), var(--darker));
            color: var(--light);
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 2rem;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .game-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 1.5rem;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        .game-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
        }

        .game-card a {
            text-decoration: none;
            color: var(--light);
            font-weight: 500;
            font-size: 1.2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }

        .game-card i {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            color: var(--secondary);
        }

        footer {
            margin-top: 3rem;
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
        }

        @media (max-width: 600px) {
            .games-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body>
    <button class="theme-toggle" id="theme-toggle" title="Toggle theme">☀</button>
    <div class="container">
        <h1>Game Hub</h1>

        <div class="games-grid" id="games-grid"></div>

        <footer>
            © Game Hub | All games are property of their respective owners
        </footer>
    </div>
    <script>
    (function(){
        var t=localStorage.getItem("ui-theme")||"dark";
        document.documentElement.dataset.theme=t;
        var btn=document.getElementById("theme-toggle");
        btn.textContent=t==="dark"?"☀":"☾";
        btn.addEventListener("click",function(){
            t=document.documentElement.dataset.theme==="dark"?"light":"dark";
            document.documentElement.dataset.theme=t;
            localStorage.setItem("ui-theme",t);
            btn.textContent=t==="dark"?"☀":"☾";
        });
    })();
    </script>
    <script>
    (function(){
        var GAMES = [
            { href: "memory.html", icon: "fas fa-brain", name: "Memory Game" },
            { href: "picture.html", icon: "fas fa-image", name: "Picture Puzzle" },
            { href: "flyletters.html", icon: "fas fa-font", name: "Fly Letters", desktopOnly: true },
            { href: "numorder.html", icon: "fas fa-sort-numeric-up", name: "Number Order", desktopOnly: true },
            { href: "bricks.html", icon: "fa-solid fa-cube", name: "Bricks", desktopOnly: true },
            { href: "water.html", icon: "fa-solid fa-water", name: "Water", desktopOnly: true },
            { href: "counting.html", icon: "fas fa-calculator", name: "Counting Game", desktopOnly: true },
            { href: "arithmetic.html", icon: "fas fa-plus", name: "Arithmetic Trainer" },
            { href: "mastermind.html", icon: "fas fa-key", name: "Mastermind" },
            { href: "nonograms.html", icon: "fas fa-th", name: "Nonograms" },
            { href: "pixelart.html", icon: "fas fa-palette", name: "Pixel Art" },
            { href: "life.html", icon: "fas fa-seedling", name: "Life Simulator" },
            { href: "avoid-collision.html", icon: "fas fa-rocket", name: "Space Shooter" },
            { href: "findletter.html", icon: "fas fa-search", name: "Find Letter" },
            { href: "visibility-towers.html", icon: "fas fa-building", name: "Visibility Towers" },
            { href: "truth-tellers.html", icon: "fas fa-comments", name: "Truth-Tellers" },
            { href: "cryptograms.html", icon: "fas fa-lock", name: "Cryptograms" },
            { href: "tile-toggle.html", icon: "fas fa-th-large", name: "Tile Toggle" }
        ];

        var mobileQuery = window.matchMedia("(pointer: coarse)");
        var grid = document.getElementById("games-grid");

        function renderGames() {
            var isMobile = mobileQuery.matches;
            var visible = GAMES.filter(function(g) { return !(isMobile && g.desktopOnly); });
            grid.innerHTML = visible.map(function(g) {
                return '<div class="game-card"><a href="' + g.href + '"><i class="' + g.icon + '"></i><span>' + g.name + '</span></a></div>';
            }).join("");
        }

        renderGames();
        mobileQuery.addEventListener("change", renderGames);
    })();
    </script>
</body>

</html>
