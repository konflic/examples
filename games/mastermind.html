<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mastermind — Code Breaker</title>
    <link rel="stylesheet" href="ui.css">
    <style>
        :root { --slot: clamp(30px, 9vw, 46px); }
        html, body { height: 100%; overflow: hidden; }
        body {
            text-align: center;
            display: flex;
            flex-direction: column;
            height: 100dvh;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        h1 { flex-shrink: 0; }
        .stat { min-width: 86px; }
        .game-area {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            width: min(94vw, 900px);
            margin: 0 auto;
            padding-bottom: 6px;
        }
        .palette {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            padding: 8px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 6px;
            margin-bottom: 8px;
            flex-shrink: 0;
        }
        .palette button {
            width: var(--slot);
            height: var(--slot);
            border-radius: 5px;
            border: 1px solid #555;
            padding: 0;
            font-size: clamp(11px, 3vw, 15px);
            font-weight: bold;
            color: #fff;
        }
        .palette button.light { color: #111; }
        .current-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px;
            margin-bottom: 8px;
            flex-shrink: 0;
        }
        .slot {
            width: var(--slot);
            height: var(--slot);
            border-radius: 5px;
            border: 1px solid #444;
            background: #2a2a2a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(11px, 3vw, 15px);
            font-weight: bold;
            user-select: none;
        }
        .slot.filled { border-color: #666; }
        .slot.light { color: #111; }
        .board {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 2px 4px 8px;
        }
        .guess-row {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 5px;
            padding: 5px 8px;
            justify-content: center;
        }
        .guess-row.win-row { border-color: var(--accent2); }
        .guess-row.lose-row { border-color: var(--danger); }
        .guess-num { font-size: 12px; color: #666; width: 26px; flex-shrink: 0; }
        .guess-slots { display: flex; gap: 5px; }
        .guess-slots .slot {
            width: clamp(26px, 7vw, 36px);
            height: clamp(26px, 7vw, 36px);
            font-size: clamp(10px, 2.6vw, 13px);
        }
        .feedback {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 3px;
            margin-left: 8px;
            flex-shrink: 0;
        }
        .feedback i {
            width: 10px;
            height: 10px;
            border-radius: 3px;
            background: #2a2a2a;
            border: 1px solid #444;
        }
        .feedback i.exact { background: #e5e5e5; border-color: #999; }
        .feedback i.match { background: #f87171; border-color: #f87171; }
        .note { color: #666; font-size: 12px; flex-shrink: 0; }
        @media (max-width: 600px) {
            h1 { font-size: 1.15rem; margin: 6px 0 2px; }
            .stats { gap: 5px; }
            .stat { min-width: 0; padding: 3px 7px; font-size: 11px; }
            select, button { font-size: 12px; padding: 5px 9px; }
            .game-area { width: 98vw; }
            .palette { gap: 6px; padding: 6px; }
        }
        @media (max-height: 640px) {
            h1 { font-size: 1rem; margin: 4px 0 2px; }
            .palette { padding: 4px; margin-bottom: 4px; }
            .current-row { padding: 4px; margin-bottom: 4px; }
            .slot { width: clamp(26px, 8vw, 38px); height: clamp(26px, 8vw, 38px); }
            .stats .stat { font-size: 11px; }
        }
    </style>
</head>
<body>
    <button class="theme-toggle" id="theme-toggle" title="Toggle theme">☀</button>
    <h1>Mastermind — Code Breaker</h1>
    <div class="controls">
        <div class="field">
            <label for="level-select">Level:</label>
            <select id="level-select"></select>
        </div>
        <div class="btns">
            <button id="new-btn">New Game</button>
            <button id="guess-btn">Guess</button>
            <button id="clear-btn">Clear</button>
        </div>
    </div>
    <div class="stats">
        <div class="stat"><span class="stat-label">Wins</span><span class="stat-value" id="wins">0</span></div>
        <div class="stat"><span class="stat-label">Losses</span><span class="stat-value" id="losses">0</span></div>
        <div class="stat"><span class="stat-label">Best</span><span class="stat-value" id="best">–</span></div>
        <div class="stat"><span class="stat-label">Attempts</span><span class="stat-value"><span id="attempts">0</span>/<span id="max-attempts">–</span></span></div>
        <div class="stat"><span class="stat-label">Time</span><span class="stat-value">⏱ <span id="timer">–</span></span></div>
    </div>
    <div class="game-area">
        <div id="palette" class="palette"></div>
        <div id="current-row" class="current-row"></div>
        <div id="board" class="board"></div>
        <div id="legend" class="note">● white = right color &amp; right position · red = right color, wrong position</div>
    </div>
    <script>
    'use strict';
    document.addEventListener('DOMContentLoaded', () => {
        const COLORS = [
            '#e74c3c', '#e67e22', '#f1c40f', '#2ecc71', '#3498db', '#9b59b6',
            '#fd79a8', '#00cec9', '#f8c291', '#a04000', '#dfe6e9', '#2d3436'
        ];
        const TAGS = ['Rookie', 'Novice', 'Learner', 'Apprentice', 'Skilled', 'Advanced',
                      'Expert', 'Pro', 'Master', 'Grandmaster', 'Legend', 'Nightmare'];
        const LEVELS = [
            { pegs: 4, colors: 4, dup: false, max: 12, mode: 'classic', time: 0 },
            { pegs: 4, colors: 5, dup: false, max: 12, mode: 'classic', time: 0 },
            { pegs: 4, colors: 6, dup: false, max: 10, mode: 'classic', time: 0 },
            { pegs: 4, colors: 6, dup: true,  max: 10, mode: 'classic', time: 0 },
            { pegs: 4, colors: 8, dup: true,  max: 9,  mode: 'classic', time: 0 },
            { pegs: 5, colors: 8, dup: true,  max: 9,  mode: 'classic', time: 0 },
            { pegs: 5, colors: 9, dup: true,  max: 8,  mode: 'classic', time: 90 },
            { pegs: 6, colors: 8, dup: true,  max: 8,  mode: 'classic', time: 0 },
            { pegs: 6, colors: 10, dup: true, max: 8,  mode: 'classic', time: 120 },
            { pegs: 5, colors: 10, dup: true, max: 8,  mode: 'black',  time: 0 },
            { pegs: 6, colors: 10, dup: true, max: 7,  mode: 'black',  time: 150 },
            { pegs: 6, colors: 12, dup: true, max: 9,  mode: 'black',  time: 120 },
        ];

        const levelSelect = document.getElementById('level-select');
        const newBtn = document.getElementById('new-btn');
        const guessBtn = document.getElementById('guess-btn');
        const clearBtn = document.getElementById('clear-btn');
        const paletteEl = document.getElementById('palette');
        const currentRowEl = document.getElementById('current-row');
        const boardEl = document.getElementById('board');
        const legendEl = document.getElementById('legend');
        const winsEl = document.getElementById('wins');
        const lossesEl = document.getElementById('losses');
        const bestEl = document.getElementById('best');
        const attemptsEl = document.getElementById('attempts');
        const maxAttemptsEl = document.getElementById('max-attempts');
        const timerEl = document.getElementById('timer');

        // Audio
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        function beep(freq = 700, dur = 0.1, vol = 0.25) {
            const o = audioContext.createOscillator();
            const g = audioContext.createGain();
            o.connect(g); g.connect(audioContext.destination);
            o.type = 'sine'; o.frequency.value = freq;
            g.gain.setValueAtTime(vol, audioContext.currentTime);
            g.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + dur);
            o.start(); o.stop(audioContext.currentTime + dur);
        }
        function successSound() { beep(600, 0.08, 0.25); setTimeout(() => beep(900, 0.08, 0.2), 90); }
        function errorSound() { beep(180, 0.15, 0.18); }
        function winSound() { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, 0.12, 0.25), i * 120)); }
        function loseSound() { [400, 300, 200].forEach((f, i) => setTimeout(() => beep(f, 0.18, 0.2), i * 180)); }

        // State
        let cfg = null, secret = [], current = [], guesses = [], gameOver = false, attempts = 0;
        let timerId = null, timeLeft = 0, timeStarted = false;

        function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
        function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
        function isLight(hex) {
            const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
            return (0.299 * r + 0.587 * g + 0.114 * b) > 150;
        }
        function factorial(n) { let r = 1; for (let i = 2; i <= n; i++) r *= i; return r; }
        function possibilities(c) { return c.dup ? Math.pow(c.colors, c.pegs) : factorial(c.colors) / factorial(c.colors - c.pegs); }

        // Persistence
        function load(k, d) { const v = localStorage.getItem(k); return v === null ? d : Number(v); }
        function save(k, v) { localStorage.setItem(k, String(v)); }

        function buildLevelOptions() {
            LEVELS.forEach((c, i) => {
                const opt = document.createElement('option');
                opt.value = i;
                const codes = possibilities(c);
                const parts = [TAGS[i], `${c.pegs}×${c.colors}`, c.dup ? 'dup' : 'no-dup',
                               `${codes.toLocaleString()} codes`, `${c.max} guesses`];
                if (c.time) parts.push(`${c.time}s`);
                if (c.mode === 'black') parts.push('BLACK');
                opt.textContent = `${i + 1}. ${parts.join(' · ')}`;
                levelSelect.appendChild(opt);
            });
        }

        function generateSecret(c) {
            if (c.dup) return Array.from({ length: c.pegs }, () => randInt(0, c.colors - 1));
            return shuffle([...Array(c.colors).keys()]).slice(0, c.pegs);
        }

        function evaluate(secretGuess, guess) {
            let exact = 0;
            const sUsed = [], gUsed = [];
            for (let i = 0; i < secretGuess.length; i++) {
                if (guess[i] === secretGuess[i]) exact++;
                else { sUsed.push(secretGuess[i]); gUsed.push(guess[i]); }
            }
            let match = 0;
            for (const c of gUsed) {
                const idx = sUsed.indexOf(c);
                if (idx !== -1) { match++; sUsed.splice(idx, 1); }
            }
            return { exact, match };
        }

        function buildSlot(slotClass, colorIdx) {
            const d = document.createElement('div');
            d.className = slotClass + (colorIdx !== null && colorIdx !== undefined ? ' filled' : '');
            if (colorIdx !== null && colorIdx !== undefined) {
                d.style.background = COLORS[colorIdx];
                d.style.color = isLight(COLORS[colorIdx]) ? '#111' : '#fff';
                if (isLight(COLORS[colorIdx])) d.classList.add('light');
                d.textContent = colorIdx + 1;
            }
            return d;
        }

        function renderPalette() {
            paletteEl.innerHTML = '';
            for (let i = 0; i < cfg.colors; i++) {
                const b = document.createElement('button');
                b.style.background = COLORS[i];
                if (isLight(COLORS[i])) b.classList.add('light');
                b.textContent = i + 1;
                b.addEventListener('click', () => {
                    if (gameOver) return;
                    if (audioContext.state === 'suspended') audioContext.resume();
                    if (current.length < cfg.pegs) {
                        current.push(i);
                        successSound();
                        renderCurrentRow();
                    }
                });
                paletteEl.appendChild(b);
            }
        }

        function renderCurrentRow() {
            currentRowEl.innerHTML = '';
            for (let i = 0; i < cfg.pegs; i++) {
                const idx = i < current.length ? current[i] : null;
                const s = buildSlot('slot', idx);
                if (idx !== null && idx !== undefined) {
                    s.addEventListener('click', () => {
                        if (gameOver) return;
                        current.splice(i, 1);
                        renderCurrentRow();
                    });
                }
                currentRowEl.appendChild(s);
            }
        }

        function renderFeedback(fb) {
            const g = document.createElement('div');
            g.className = 'feedback';
            g.style.gridTemplateColumns = `repeat(${cfg.pegs}, 1fr)`;
            let shown = 0;
            for (let i = 0; i < fb.exact; i++) {
                const d = document.createElement('i'); d.className = 'exact'; g.appendChild(d);
            }
            shown = fb.exact;
            if (cfg.mode === 'classic') {
                for (let i = 0; i < fb.match; i++) {
                    const d = document.createElement('i'); d.className = 'match'; g.appendChild(d);
                }
                shown += fb.match;
            }
            for (let i = shown; i < cfg.pegs; i++) {
                const d = document.createElement('i'); g.appendChild(d);
            }
            return g;
        }

        function renderBoard() {
            boardEl.innerHTML = '';
            for (let i = guesses.length - 1; i >= 0; i--) {
                const row = guesses[i];
                const r = document.createElement('div');
                r.className = 'guess-row' + (row.win ? ' win-row' : '');
                const num = document.createElement('div');
                num.className = 'guess-num';
                num.textContent = (i + 1) + '.';
                r.appendChild(num);
                const slots = document.createElement('div');
                slots.className = 'guess-slots';
                row.guess.forEach(idx => slots.appendChild(buildSlot('slot', idx)));
                r.appendChild(slots);
                r.appendChild(renderFeedback(row.fb));
                boardEl.appendChild(r);
            }
        }

        function updateStats() {
            winsEl.textContent = load('mm_wins', 0);
            lossesEl.textContent = load('mm_losses', 0);
            const best = localStorage.getItem('mm_best_' + levelSelect.value);
            bestEl.textContent = best === null ? '–' : best;
            attemptsEl.textContent = attempts;
            maxAttemptsEl.textContent = cfg ? cfg.max : '–';
            updateTimer();
        }

        function updateTimer() {
            if (!cfg || cfg.time === 0 || timeLeft <= 0) {
                timerEl.textContent = cfg && cfg.time > 0 ? fmtTime(cfg.time) : '∞';
                return;
            }
            timerEl.textContent = fmtTime(timeLeft);
        }

        function fmtTime(s) {
            s = Math.max(0, Math.ceil(s));
            const m = Math.floor(s / 60), r = s % 60;
            return m + ':' + String(r).padStart(2, '0');
        }

        function startTimer(sec) {
            clearInterval(timerId);
            timeLeft = sec;
            timeStarted = false;
            updateTimer();
            if (sec > 0) {
                timerId = setInterval(() => {
                    timeLeft--;
                    updateTimer();
                    if (timeLeft <= 0) {
                        clearInterval(timerId);
                        endGame('time');
                    }
                }, 1000);
            }
        }

        function endGame(reason) {
            if (gameOver) return;
            gameOver = true;
            clearInterval(timerId);
            guessBtn.disabled = true;
            clearBtn.disabled = true;
            if (reason === 'time') {
                lossesEl.textContent = load('mm_losses', 0) + 1;
                save('mm_losses', load('mm_losses', 0));
                loseSound();
                revealSecret('Time up! The code was:');
            }
        }

        function revealSecret() {
            const r = document.createElement('div');
            r.className = 'guess-row lose-row';
            const num = document.createElement('div');
            num.className = 'guess-num';
            num.textContent = '✕';
            r.appendChild(num);
            const slots = document.createElement('div');
            slots.className = 'guess-slots';
            secret.forEach(idx => slots.appendChild(buildSlot('slot', idx)));
            r.appendChild(slots);
            boardEl.prepend(r);
        }

        function newGame() {
            if (audioContext.state === 'suspended') audioContext.resume();
            cfg = LEVELS[Number(levelSelect.value)];
            secret = generateSecret(cfg);
            current = [];
            guesses = [];
            attempts = 0;
            gameOver = false;
            guessBtn.disabled = false;
            clearBtn.disabled = false;
            legendEl.textContent = cfg.mode === 'black'
                ? 'HARD MODE: feedback shows ONLY exact matches (white dots). No color info!'
                : '● white = right color & right position · red = right color, wrong position';
            renderPalette();
            renderCurrentRow();
            renderBoard();
            updateStats();
            startTimer(cfg.time);
        }

        guessBtn.addEventListener('click', () => {
            if (gameOver || !cfg) return;
            if (current.length < cfg.pegs) {
                errorSound();
                return;
            }
            const fb = evaluate(secret, current);
            const isWin = fb.exact === cfg.pegs;
            attempts++;
            guesses.push({ guess: [...current], fb, win: isWin });
            current = [];
            if (isWin) {
                gameOver = true;
                clearInterval(timerId);
                guessBtn.disabled = true;
                clearBtn.disabled = true;
                const t = cfg.time > 0 ? Math.max(0, cfg.time - timeLeft) : 0;
                winsEl.textContent = load('mm_wins', 0) + 1;
                save('mm_wins', load('mm_wins', 0));
                const prevBest = localStorage.getItem('mm_best_' + levelSelect.value);
                if (prevBest === null || attempts < Number(prevBest)) {
                    save('mm_best_' + levelSelect.value, attempts);
                    bestEl.textContent = attempts;
                }
                winSound();
            } else if (attempts >= cfg.max) {
                gameOver = true;
                clearInterval(timerId);
                guessBtn.disabled = true;
                clearBtn.disabled = true;
                lossesEl.textContent = load('mm_losses', 0) + 1;
                save('mm_losses', load('mm_losses', 0));
                loseSound();
                revealSecret();
            } else {
                errorSound();
            }
            renderBoard();
            renderCurrentRow();
            updateStats();
        });

        clearBtn.addEventListener('click', () => {
            if (gameOver || !cfg) return;
            current = [];
            renderCurrentRow();
        });

        newBtn.addEventListener('click', newGame);
        levelSelect.addEventListener('change', () => updateStats());

        buildLevelOptions();
        newGame();
    });
    </script>
    <script>
    (function(){
        var t=localStorage.getItem("ui-theme")||"dark";
        document.documentElement.dataset.theme=t;
        var btn=document.getElementById("theme-toggle");
        btn.textContent=t==="dark"?"☀":"☾";
        btn.addEventListener("click",function(){
            t=document.documentElement.dataset.theme==="dark"?"light":"dark";
            document.documentElement.dataset.theme=t;
            localStorage.setItem("ui-theme",t);
            btn.textContent=t==="dark"?"☀":"☾";
        });
    })();
    </script>
</body>
</html>
